<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/layout/operationalLayout.xhtml">

    <ui:define name="mainContent">
        <p:panel header="Parametri pretrage" style="padding-top: 0.571em">

            <h:panelGrid columns="4" style="width: 100%" cellspacing="7" columnClasses="width20Per,width20Per,width20Per,width20Per,width20Per">
                <ui:param name="manager" value="#{ugostiteljskiObjekatSearchController.searchParams}" />
                <h:panelGrid columns="1" style="width:100%;">
                    <p:outputLabel class="wh-search-label" for="name"
                                   value="Naziv " />
                    <p:inputText class="wh-select-input wh-select-info-item"
                                 id="name" value="#{ugostiteljskiObjekatSearchController.searchParams.naziv}" />
                </h:panelGrid>
                <h:panelGrid columns="1" style="width:100%;">
                    <p:outputLabel class="wh-search-label" for="ugostiteljUsername"
                                   value="Korisnicko ime ugostitelja " />
                    <p:inputText class="wh-select-input wh-select-info-item"
                                 id="ugostiteljUsername" value="#{ugostiteljskiObjekatSearchController.searchParams.ugostiteljUsername}" />
                </h:panelGrid>
                <h:panelGrid columns="1" style="width:100%;">
                    <p:outputLabel class="wh-search-label" for="types"
                                   value="Tip" />
                    <p:selectCheckboxMenu style="max-width:100%; display:block;"
                                          multiple="true" styleClass="selectCheckboxMenuFixHeight"
                                          filter="true" filterMatchMode="contains"
                                          id="types" value="#{ugostiteljskiObjekatSearchController.searchParams.types}">
                        <f:selectItems value="#{enums.allUgostiteljskiObjekatTypes.entrySet()}" var="entry"
                                       itemValue="#{entry.key}" itemLabel="#{entry.value}"/>
                    </p:selectCheckboxMenu>
                </h:panelGrid>
                <h:panelGrid columns="1" style="width:100%;">
                    <p:outputLabel class="wh-search-label" for="kategorizovan"
                                   value="Kategorizovan" />
                    <p:selectBooleanButton id="kategorizovan" onLabel="Da" offLabel="Ne" value="#{ugostiteljskiObjekatSearchController.searchParams.kategorizovan}"/>
                </h:panelGrid>
            </h:panelGrid>
        </p:panel>
        <h:panelGrid columns="2" style="width: 100%;">

            <h:panelGrid columns="5">
                <p:commandButton value="Pretraga"
                                 update="centralForm" action="#{ugostiteljskiObjekatSearchController.search()}"
                                 icon="fa fa-fw fa-search" />
                <p:commandButton value="Resetuj"
                                 update="centralForm"
                                 action="#{ugostiteljskiObjekatSearchController.reset()}"
                                 icon="fa fa-fw fa-refresh"
                                 process="@this">
                    <p:resetInput target="centralForm"/>
                </p:commandButton>

                <p:outputLabel value="Maksimalan broj" />
                <p:selectOneMenu id="selectOneMaxResultId"
                                 value="#{ugostiteljskiObjekatSearchController.searchParams.maxResults}"
                                 style="min-width: 120px;">
                    <f:selectItems value="#{enums.maxResults}" />
                </p:selectOneMenu>
                <p:outputLabel
                        value="Prikaz: #{ugostiteljskiObjekatSearchController.results.totalResultCount > ugostiteljskiObjekatSearchController.searchParams.maxResults ? (ugostiteljskiObjekatSearchController.searchParams.maxResults eq -1 ? ugostiteljskiObjekatSearchController.results.totalResultCount : ugostiteljskiObjekatSearchController.searchParams.maxResults) : ugostiteljskiObjekatSearchController.results.totalResultCount} od #{ugostiteljskiObjekatSearchController.results.totalResultCount}"
                        rendered="#{ugostiteljskiObjekatSearchController.results.totalResultCount gt 0 }" />
                <p:outputLabel value="Nema ugostiteljski objekata po ovim parametrima."
                               rendered="#{ugostiteljskiObjekatSearchController.results.totalResultCount eq 0 and ugostiteljskiObjekatSearchController.results.list.size() eq 0}" />
            </h:panelGrid>
        </h:panelGrid>
        <p:dataTable id="searchTable"
                     var="item"
                     rendered="#{not empty ugostiteljskiObjekatSearchController.results.list}"
                     value="#{ugostiteljskiObjekatSearchController.results.list}"
                     emptyMessage="Nema ugostiteljski objekata po ovim parametrima."
                     style="width: 100%;word-wrap: break-word"
                     rows="10"
                     rowsPerPageTemplate="5,10,15,20"
                     paginator="#{true}"
                     paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown} {Exporters}">

            <p:column headerText="Naziv" sortBy="#{item.naziv}">
                <ui:include src="/link/ugostiteljskiObjekatLink.xhtml" >
                    <ui:param name="name" value="#{item.naziv}" />
                    <ui:param name="id" value="#{item.id}" />
                </ui:include>
            </p:column>
            <p:column headerText="Tip" sortBy="#{item.tipUgostiteljskogObjekta}">
                <h:outputText value="#{item.tipUgostiteljskogObjekta.key}" />
            </p:column>

            <p:column headerText="Ugostitelj" sortBy="#{item.ugostitelj.username}">
                <ui:include src="/link/ugostiteljLink.xhtml" >
                    <ui:param name="username" value="#{item.ugostitelj.username}" />
                </ui:include>
            </p:column>
            <p:column>
                <p:commandButton rendered="#{userController.touristLoggedIn() or (userController.ugostiteljLoggedIn() and userController.loggedInUser.username eq item.ugostitelj.username)}" value="Napravi rezervaciju" action="#{navigationController.goToReservation(item.id)}"/>
            </p:column>

        </p:dataTable>
    </ui:define>
</ui:composition>
